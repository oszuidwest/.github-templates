---
name: Go CI

"on":
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to file used by setup-go to derive Go version'
        type: string
        default: 'go.mod'
      enable-frontend:
        description: 'Run a frontend lint job (Bun) alongside the Go job'
        type: boolean
        default: false
      frontend-tool:
        description: >-
          Frontend tool to use when enable-frontend is true.
          Only "bun" is supported in v1.
        type: string
        default: 'bun'
      enable-deadcode:
        description: 'Run deadcode analysis'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tools/go.mod is the Dependabot-managed source of truth for
      # analysis tool versions. Sparse-checkout keeps this cheap.
      - name: Checkout central tool pins
        uses: actions/checkout@v7
        with:
          repository: oszuidwest/.github-templates
          ref: v3
          path: .tool-pins
          sparse-checkout: tools
          sparse-checkout-cone-mode: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -race -shuffle=on -v ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --timeout=5m

      - name: Resolve analysis tool versions
        id: tool_versions
        working-directory: .tool-pins/tools
        env:
          GOTOOLCHAIN: auto
        run: |
          mod_v() {
            go list -m -f '{{.Version}}' "$1"
          }

          deadcode_v=$(mod_v golang.org/x/tools)
          govulncheck_v=$(mod_v golang.org/x/vuln)
          {
            echo "deadcode=$deadcode_v"
            echo "govulncheck=$govulncheck_v"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved:"
          echo "  deadcode=$deadcode_v"
          echo "  govulncheck=$govulncheck_v"

      - name: Install deadcode
        if: inputs.enable-deadcode
        env:
          DEADCODE_VERSION: ${{ steps.tool_versions.outputs.deadcode }}
        run: go install "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}"

      - name: Install govulncheck
        env:
          GOVULNCHECK_VERSION: ${{ steps.tool_versions.outputs.govulncheck }}
        run: >-
          go install
          "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      # -test counts test functions as reachability roots, so code that is
      # only reachable from platform-tagged files plus tests on this
      # platform is not a false positive. Trade-off: dead production code
      # that still has tests is not reported.
      - name: Check for dead code
        if: inputs.enable-deadcode
        run: |
          deadcode_output=$(deadcode -test ./...)
          if [ -n "$deadcode_output" ]; then
            echo "$deadcode_output"
            exit 1
          fi

      - name: Run govulncheck
        run: govulncheck ./...

  frontend:
    name: Frontend
    if: inputs.enable-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify frontend tool
        if: inputs.frontend-tool != 'bun'
        run: |
          echo "::error::Only frontend-tool 'bun' is supported in v1."
          exit 1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
